<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a50034"><title>LG MEA Service e-Skill Olympiad 2026 | Digital Brochure</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#f3f3f4}*{box-sizing:border-box}body{margin:0}header{height:65px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 8px #0001}header strong{color:#a50034;font-size:clamp(14px,2.4vw,20px)}button{border:0;border-radius:10px;background:#a50034;color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}button:disabled{opacity:.3;cursor:default}main{min-height:calc(100dvh - 65px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px 30px;gap:14px}.page{position:relative;width:min(440px,90vw,calc((100dvh - 205px)*.58));aspect-ratio:9/16;perspective:1500px;filter:drop-shadow(0 9px 14px #0003)}.sheet{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform-origin:left center;transition:transform .42s ease}.sheet.turn{transform:rotateY(-88deg)}canvas{width:100%;height:100%;object-fit:contain;background:#fff;display:block;backface-visibility:hidden}.controls{display:flex;align-items:center;gap:20px}.controls span{font-weight:700;min-width:55px;text-align:center}small{color:#777;text-align:center}dialog{border:0;border-radius:16px;max-width:min(420px,92vw);padding:25px;box-shadow:0 15px 45px #0004}dialog::backdrop{background:#0008}dialog img{width:190px;height:190px;display:block;margin:15px auto}dialog input{width:100%;padding:10px;margin:10px 0}#status{font-size:14px;color:#555}#qr-note{font-size:12px;color:#666}a{color:#a50034}@media(max-width:480px){header{padding:0 10px}header button{padding:10px}}
</style></head><body><header><strong>LG · MEA OLYMPIAD 2026</strong><button id="share">Share / QR</button></header><main><div id="status" role="status">Loading brochure…</div><div class="page" id="page" style="display:none"><div class="sheet" id="sheet"><canvas id="canvas" aria-label="Current brochure page"></canvas></div></div><div class="controls"><button id="prev" disabled>← Previous</button><span id="counter">—</span><button id="next" disabled>Next →</button></div><small>Swipe left or right to turn pages · Use the buttons to navigate</small></main><dialog id="modal"><h2>Share this brochure</h2><p>Scan to open this brochure on your phone.</p><div id="qrcode"></div><input id="url" readonly aria-label="Brochure website address"><button id="copy">Copy link</button> <button id="close">Close</button><p id="qr-note">The QR code points to this website. Keep the website address unchanged when replacing the PDF.</p></dialog><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);const status=$('status'),canvas=$('canvas'),sheet=$('sheet');let pdf=null,current=1,busy=false;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function draw(n){const page=await pdf.getPage(n),v=page.getViewport({scale:1});const scale=Math.min(2.5,1250/v.width),viewport=page.getViewport({scale});canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;current=n;$('counter').textContent=`${current} / ${pdf.numPages}`;$('prev').disabled=current===1;$('next').disabled=current===pdf.numPages;}
async function go(n){if(!pdf||busy||n<1||n>pdf.numPages)return;busy=true;sheet.classList.add('turn');await new Promise(r=>setTimeout(r,220));try{await draw(n)}catch(e){status.textContent='Unable to show this page: '+e.message;status.style.display='block'}sheet.classList.remove('turn');setTimeout(()=>busy=false,220)}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight')go(current+1)});let x=0;$('page').addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});$('page').addEventListener('touchend',e=>{let d=e.changedTouches[0].screenX-x;if(Math.abs(d)>45)go(current+(d<0?1:-1))},{passive:true});
$('share').onclick=()=>{$('modal').showModal();$('url').value=location.href.split('#')[0];$('qrcode').innerHTML='';if(typeof QRCode!=='undefined')new QRCode($('qrcode'),{text:$('url').value,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});else $('qrcode').textContent='QR generator unavailable; copy the link instead.'};$('close').onclick=()=>$('modal').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('url').value);$('copy').textContent='Copied!'}catch(e){$('url').select()}};
(async()=>{try{if(typeof pdfjsLib==='undefined')throw Error('PDF viewer library could not load. Check your internet connection.');pdf=await pdfjsLib.getDocument({url:'brochure.pdf',disableAutoFetch:false}).promise;await draw(1);$('page').style.display='block';status.style.display='none'}catch(e){status.textContent='Could not load brochure.pdf. Confirm that brochure.pdf is uploaded beside index.html. ('+e.message+')'}})();
</script></body></html>
