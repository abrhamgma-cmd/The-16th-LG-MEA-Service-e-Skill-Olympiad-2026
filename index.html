<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a50034"><title>LG MEA Service e-Skill Olympiad 2026 | Digital Brochure</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#242424;background:#f3f3f5}*{box-sizing:border-box}body{margin:0}header{height:66px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 12px #0000000d;gap:12px}header strong{color:#a50034;font-size:clamp(14px,2vw,20px)}button{border:0;cursor:pointer;font-weight:700;border-radius:12px;padding:12px 19px;background:#a50034;color:white}button:disabled{opacity:.35;cursor:default}.secondary{background:#fff;color:#a50034;border:1px solid #e2c5d0}main{text-align:center;max-width:1200px;margin:auto;padding:18px 12px 32px}.hint{font-size:13px;color:#777;margin-top:12px}.stage{position:relative;height:min(69vh,720px);min-height:350px;perspective:1400px;overflow:hidden;touch-action:pan-y}.page{position:absolute;top:50%;left:50%;height:calc(100% - 24px);max-width:85vw;aspect-ratio: .62;transform-style:preserve-3d;backface-visibility:hidden;background:white;box-shadow:0 15px 40px #0003;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;transform:translate(-50%,-50%) translateX(0) rotateY(0) scale(1);opacity:0;pointer-events:none;overflow:hidden;border-radius:4px}.page canvas{width:100%;height:100%;object-fit:contain;display:block}.page.active{opacity:1;z-index:5;pointer-events:auto}.page.prev{opacity:.55;z-index:3;transform:translate(-50%,-50%) translateX(-78%) rotateY(42deg) scale(.76);filter:brightness(.85)}.page.next{opacity:.55;z-index:3;transform:translate(-50%,-50%) translateX(78%) rotateY(-42deg) scale(.76);filter:brightness(.85)}.page.hidden{opacity:0;z-index:0;transform:translate(-50%,-50%) scale(.6)}.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:10px}.counter{font-weight:700;min-width:60px}.status{color:#777;margin:20px}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(95vw,380px);background:white;border-radius:18px;padding:24px;text-align:center}.dialog img{width:220px;height:220px;max-width:100%;object-fit:contain}.dialog p{overflow-wrap:anywhere;font-size:13px;color:#666}footer{color:#888;font-size:12px;text-align:center;padding:8px 16px 24px}@media(max-width:650px){header{padding:0 12px}.stage{height:65vh;min-height:340px}.page{height:calc(100% - 20px);max-width:76vw}.page.prev{transform:translate(-50%,-50%) translateX(-68%) rotateY(42deg) scale(.65)}.page.next{transform:translate(-50%,-50%) translateX(68%) rotateY(-42deg) scale(.65)}.controls{gap:10px}button{padding:11px 13px}}

@media (max-width: 768px) {
  header,
  #share,
  #prev,
  #next {
    display: none !important;
  }

  body {
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden;
  }
}
</style></head><body><header><strong>LG · MEA OLYMPIAD 2026</strong><button id="share">Share / QR</button></header><main><div id="status" class="status">Loading your brochure…</div><div class="stage" id="stage" aria-label="Interactive 3D brochure carousel"></div><div class="controls"><button id="prev" class="secondary">← Previous</button><span id="counter" class="counter">—</span><button id="next">Next →</button></div><div class="hint">Swipe left or right · Use arrow keys or buttons to navigate</div></main><footer>LG MEA Service e-Skill Olympiad 2026 · Dubai</footer><div class="modal" id="modal"><div class="dialog"><h2>Scan to open brochure</h2><img id="qr" alt="QR code to open brochure"><p id="siteurl"></p><button id="copy">Copy link</button> <button id="close" class="secondary">Close</button></div></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);let pdf=null,current=0,n=0,rendered=new Map();const stage=$('stage'),status=$('status');
async function render(i){if(i<0||i>=n||rendered.has(i))return;const page=await pdf.getPage(i+1);const base=page.getViewport({scale:1});const scale=Math.min(2,Math.max(1,1000/base.height));const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);const div=document.createElement('div');div.className='page hidden';div.style.aspectRatio=`${viewport.width}/${viewport.height}`;div.append(canvas);stage.append(div);rendered.set(i,div);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;layout()}
function layout(){for(const [i,el] of rendered){el.className='page '+(i===current?'active':i===current-1?'prev':i===current+1?'next':'hidden');el.setAttribute('aria-hidden',String(i!==current))} $('counter').textContent=`${current+1} / ${n}`;$('prev').disabled=current===0;$('next').disabled=current===n-1}
async function go(i){if(!pdf||i<0||i>=n||i===current)return;current=i;await Promise.all([render(i-1),render(i),render(i+1)]);layout();for(const [k,el] of rendered){if(Math.abs(k-current)>2){el.remove();rendered.delete(k)}}}
try{pdf=await pdfjsLib.getDocument({url:'brochure.pdf',disableAutoFetch:false}).promise;n=pdf.numPages;await Promise.all([render(0),render(1)]);layout();status.style.display='none'}catch(err){status.textContent='Unable to open brochure.pdf. Check that the PDF is named exactly brochure.pdf and is in the same GitHub folder as index.html.';console.error(err)}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if($('modal').classList.contains('open')){if(e.key==='Escape')$('modal').classList.remove('open');return}if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let x=null;stage.addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{if(x===null)return;const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>45)go(current+(d<0?1:-1));x=null},{passive:true});
$('share').onclick=()=>{const url=location.href.split('#')[0];$('siteurl').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(url);$('modal').classList.add('open')};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]);$('copy').textContent='Copied!'}catch{window.prompt('Copy your website link:',location.href)}};

const qrImage = document.getElementById('qr');

if (qrImage) {
  const wrapper = document.createElement('div');
  wrapper.style.cssText =
    'position:relative;width:220px;height:220px;margin:auto;';

  qrImage.parentNode.insertBefore(wrapper, qrImage);
  wrapper.appendChild(qrImage);

  qrImage.style.cssText = 'width:100%;height:100%;';

  const logo = document.createElement('img');
  logo.src = 'olympiad-logo.png';

  logo.style.cssText = `
    position:absolute;
    width:25%;
    height:25%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    border-radius:50%;
    padding:3px;
    object-fit:contain;
    box-sizing:border-box;
  `;

  wrapper.appendChild(logo);
}
</script></body></html>
